name: Apply physical-key preservation fix

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply patch
        shell: pwsh
        run: |
          git apply --check patches/preserve-physical-key-state.patch
          git apply patches/preserve-physical-key-state.patch
          gofmt -w joycon_output_windows.go joycon_integration_windows_test.go
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Remove one-time patch machinery
        shell: pwsh
        run: git rm patches/preserve-physical-key-state.patch .github/workflows/apply-preserve-physical-keys.yml
      - name: Commit verified fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- joycon_output_windows.go joycon_integration_windows_test.go
          git commit -m "fix: preserve physical key state during Joy-Con output"
          git push origin HEAD:feature/joycon-l
