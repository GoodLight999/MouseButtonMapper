name: Apply Joy-Con reset-boundary fix

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply reset-boundary patch
        shell: pwsh
        run: |
          git apply --check patches/joycon-reset-boundaries.patch
          git apply patches/joycon-reset-boundaries.patch
          gofmt -w main.go
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Remove one-time patch machinery
        shell: pwsh
        run: git rm patches/joycon-reset-boundaries.patch .github/workflows/apply-joycon-reset-boundaries.yml
      - name: Commit verified fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.go
          git commit -m "fix: release Joy-Con holds across reset boundaries"
          git push origin HEAD:feature/joycon-l
