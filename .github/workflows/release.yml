name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "8.4.0-rc2-${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        shell: pwsh
        run: |
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Build release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          .\scripts\package.ps1 -Version $version
          Copy-Item MouseButtonMapper.exe "dist\MouseButtonMapper-v$version.exe"
          git archive --format=zip --output="dist/MouseButtonMapper-v$version-source.zip" HEAD
          $files = @(
            "dist\MouseButtonMapper-v$version.exe",
            "dist\MouseButtonMapper-v$version-windows-x64.zip",
            "dist\MouseButtonMapper-v$version-source.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "dist\MouseButtonMapper-v$version-SHA256SUMS.txt"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MouseButtonMapper-release-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $assets = Get-ChildItem dist\MouseButtonMapper-v$version*
          gh release create "${{ github.ref_name }}" $assets.FullName --generate-notes --title "MouseButtonMapper ${{ github.ref_name }}"
