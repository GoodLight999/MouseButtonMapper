name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "8.3.0-${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build portable package
        shell: pwsh
        run: .\scripts\package.ps1 -Version "${{ steps.version.outputs.value }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MouseButtonMapper-release-${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($zip.FullName).sha256"
          "$hash  $($zip.Name)" | Set-Content -Encoding ascii $checksum
          gh release create "${{ github.ref_name }}" $zip.FullName $checksum --generate-notes --title "MouseButtonMapper ${{ github.ref_name }}"
