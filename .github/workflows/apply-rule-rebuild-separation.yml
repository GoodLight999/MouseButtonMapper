name: Apply rule-only Joy-Con rebuild separation

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply patch
        shell: pwsh
        run: |
          git apply --check patches/avoid-rule-edit-joycon-rescan.patch
          git apply patches/avoid-rule-edit-joycon-rescan.patch
          gofmt -w main.go joycon_rule_rebuild_windows_test.go
          $changed = git diff --name-only
          if ($changed -notcontains 'main.go') { throw 'main.go was not modified' }
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Stage verified code and cleanup
        shell: pwsh
        run: |
          git rm patches/avoid-rule-edit-joycon-rescan.patch .github/workflows/apply-rule-rebuild-separation.yml
          git add -A
          $staged = git diff --cached --name-only
          if ($staged -notcontains 'main.go') { throw 'main.go fix is absent from staged commit' }
          if ($staged -notcontains 'joycon_rule_rebuild_windows_test.go') { throw 'rebuild regression test is absent from staged commit' }
      - name: Commit verified change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: avoid Joy-Con reconnects for rule-only edits"
          git push origin HEAD:feature/joycon-l
