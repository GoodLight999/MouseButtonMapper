name: Apply audited Joy-Con fixes

on:
  push:
    branches: [feature/joycon-l]
    paths:
      - patches/joycon-audit-payload/*.part
      - .github/workflows/apply-joycon-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Reconstruct and verify audited source files
        shell: pwsh
        run: |
          $parts = Get-ChildItem patches\joycon-audit-payload\*.part | Sort-Object Name
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'joycon-audit-payload.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a32fdda294314b57ed8c22b59ff3c61395175d77e2c31ab900a0dfd7fcaa574e') {
            throw "Joy-Con audit payload SHA-256 mismatch: $hash"
          }
          Expand-Archive -Path $archive -DestinationPath . -Force
          gofmt -w joycon_logic.go joycon_logic_test.go joycon_app_windows.go joycon_hid_windows.go joycon_web_windows.go joycon_ui_windows.go joycon_integration_windows_test.go joycon_lifecycle_windows_test.go
          go test ./...
          go vet -unsafeptr=false ./...
          git diff --check
      - name: Commit verified product tree
        shell: pwsh
        run: |
          git rm -r patches/joycon-audit-payload .github/workflows/apply-joycon-audit-fixes.yml
          git add joycon_logic.go joycon_logic_test.go joycon_app_windows.go joycon_hid_windows.go joycon_web_windows.go joycon_ui_windows.go joycon_integration_windows_test.go joycon_lifecycle_windows_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden Joy-Con lifecycle and fallback input"
          git push origin HEAD:feature/joycon-l
