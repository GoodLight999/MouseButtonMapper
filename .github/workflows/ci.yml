name: CI

on:
  push:
    branches: [main, "stabilize-**", "feature/**", "fix/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Public repository audit
        run: python3 scripts/check_public_repo.py
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Upload integration source snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: joycon-integration-sources
          path: |
            main.go
            joycon_app_windows.go
            joycon_worker.go
            web_assets.go
          if-no-files-found: error
          retention-days: 1

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows unit tests
        shell: pwsh
        run: |
          go test ./... 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics
          path: windows-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Windows vet
        shell: pwsh
        run: go vet -unsafeptr=false ./...
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1 -Version 8.3.0
      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: MouseButtonMapper-windows-x64
          path: dist/MouseButtonMapper-v8.3.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  apply-key-prefix-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/joycon-prefix-validation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and verify prefix-consumption patch
        shell: pwsh
        run: |
          git apply --check patches/consume-key-trigger-prefixes.patch
          git apply patches/consume-key-trigger-prefixes.patch
          gofmt -w main.go joycon_key_prefix_windows_test.go
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Stage verified files
        shell: pwsh
        run: |
          git rm patches/consume-key-trigger-prefixes.patch
          git add main.go joycon_key_prefix_windows_test.go
          git diff --cached --name-status
      - name: Configure commit identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit verified files
        shell: pwsh
        run: git commit -m "fix: consume prefixes for keyboard-triggered combinations"
      - name: Push verified commit
        shell: pwsh
        run: git push origin HEAD:feature/joycon-l
