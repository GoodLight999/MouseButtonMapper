name: CI

on:
  push:
    branches: [main, "stabilize-**", "feature/**", "fix/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Public repository audit
        run: python3 scripts/check_public_repo.py
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Upload integration source snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: joycon-integration-sources
          path: |
            main.go
            joycon_app_windows.go
            joycon_worker.go
            web_assets.go
          if-no-files-found: error
          retention-days: 1

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows unit tests
        shell: pwsh
        run: |
          go test ./... 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics
          path: windows-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Windows vet
        shell: pwsh
        run: go vet -unsafeptr=false ./...
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1 -Version 8.3.0
      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: MouseButtonMapper-windows-x64
          path: dist/MouseButtonMapper-v8.3.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
