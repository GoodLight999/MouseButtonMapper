name: CI

on:
  push:
    branches: [main, "stabilize-**", "feature/**", "fix/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Public repository audit
        run: python3 scripts/check_public_repo.py
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Upload integration source snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: joycon-integration-sources
          path: |
            main.go
            joycon_app_windows.go
            joycon_worker.go
            web_assets.go
          if-no-files-found: error
          retention-days: 1

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows unit tests
        shell: pwsh
        run: |
          go test ./... 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics
          path: windows-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Windows vet
        shell: pwsh
        run: go vet -unsafeptr=false ./...
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1 -Version 8.3.0
      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: MouseButtonMapper-windows-x64
          path: dist/MouseButtonMapper-v8.3.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  apply-rule-rebuild:
    if: github.ref == 'refs/heads/feature/joycon-l'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and verify rule-rebuild separation
        shell: pwsh
        run: |
          git apply --check patches/avoid-rule-edit-joycon-rescan.patch
          git apply patches/avoid-rule-edit-joycon-rescan.patch
          gofmt -w main.go joycon_rule_rebuild_windows_test.go
          $changed = git diff --name-only
          if ($changed -notcontains 'main.go') { throw 'main.go was not modified' }
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Remove one-time CI job and commit
        shell: pwsh
        run: |
          git rm patches/avoid-rule-edit-joycon-rescan.patch
          $path = '.github/workflows/ci.yml'
          $text = Get-Content $path -Raw
          $marker = "`n  apply-rule-rebuild:"
          $index = $text.IndexOf($marker)
          if ($index -lt 0) { throw 'temporary CI marker was not found' }
          $text = $text.Substring(0, $index)
          $text = [regex]::Replace($text, 'permissions:\r?\n  contents: write', "permissions:`n  contents: read", 1)
          [IO.File]::WriteAllText($path, $text.TrimEnd() + "`n", [Text.UTF8Encoding]::new($false))
          git add -A
          $staged = git diff --cached --name-only
          if ($staged -notcontains 'main.go') { throw 'main.go fix is absent from staged commit' }
          if ($staged -notcontains 'joycon_rule_rebuild_windows_test.go') { throw 'rebuild test is absent from staged commit' }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: avoid Joy-Con reconnects for rule-only edits"
          git push origin HEAD:feature/joycon-l
