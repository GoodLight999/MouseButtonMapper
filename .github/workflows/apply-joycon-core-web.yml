name: Apply verified Joy-Con core integration

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply patch
        run: |
          git apply --check patches/joycon-core-web.patch
          git apply patches/joycon-core-web.patch
          gofmt -w main.go joycon_app_windows.go joycon_worker.go joycon_web_windows.go joycon_output_validation_windows.go
          go test ./...
      - name: Remove one-time patch machinery
        run: git rm patches/joycon-core-web.patch .github/workflows/apply-joycon-core-web.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "feat: complete Joy-Con core and settings API integration"
          git push origin HEAD:feature/joycon-l
