name: Format Joy-Con integration tests

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          gofmt -w *.go
          go test ./...
      - run: git rm .github/workflows/format-joycon-tests.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style: format Joy-Con integration tests"
          git push origin HEAD:feature/joycon-l
