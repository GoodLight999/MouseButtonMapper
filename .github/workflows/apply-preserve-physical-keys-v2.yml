name: Apply physical-key preservation fix v2

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply patch
        shell: pwsh
        run: |
          git apply --check patches/preserve-physical-key-state-v2.patch
          git apply patches/preserve-physical-key-state-v2.patch
          gofmt -w joycon_output_windows.go joycon_integration_windows_test.go
          $changed = git diff --name-only
          if ($changed -notcontains 'joycon_output_windows.go') { throw 'joycon_output_windows.go was not modified' }
          if ($changed -notcontains 'joycon_integration_windows_test.go') { throw 'Joy-Con preservation test was not modified' }
          go test ./...
          go vet -unsafeptr=false ./...
      - name: Stage verified code and cleanup
        shell: pwsh
        run: |
          git rm patches/preserve-physical-key-state-v2.patch .github/workflows/apply-preserve-physical-keys-v2.yml
          git add -A
          $staged = git diff --cached --name-only
          if ($staged -notcontains 'joycon_output_windows.go') { throw 'output fix is absent from staged commit' }
          if ($staged -notcontains 'joycon_integration_windows_test.go') { throw 'regression test is absent from staged commit' }
      - name: Commit verified fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve physical key state during Joy-Con output"
          git push origin HEAD:feature/joycon-l
