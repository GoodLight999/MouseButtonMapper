name: Apply verified Joy-Con UI hook

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply patch
        run: |
          git apply --check patches/joycon-ui-hook.patch
          git apply patches/joycon-ui-hook.patch
          gofmt -w main.go web_assets.go joycon_ui_windows.go
          go test ./...
      - name: Remove one-time patch machinery
        run: git rm patches/joycon-ui-hook.patch .github/workflows/apply-joycon-ui-hook.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "feat: add Joy-Con panel to existing web UI"
          git push origin HEAD:feature/joycon-l
