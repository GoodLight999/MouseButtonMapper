name: Apply Joy-Con held-output release

on:
  push:
    branches: [feature/joycon-l]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/joycon-l
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          git apply --check patches/release-joycon-hold.patch
          git apply patches/release-joycon-hold.patch
          gofmt -w main.go joycon_release_windows.go
          go test ./...
      - run: git rm patches/release-joycon-hold.patch .github/workflows/apply-release-joycon-hold.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "fix: release Joy-Con-held keys when conversion stops"
          git push origin HEAD:feature/joycon-l
